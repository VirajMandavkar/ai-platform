<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Portal | VibeScout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace']
                    },
                    colors: {
                        brandBlue: '#2563eb',
                        brandDark: '#0f172a',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col justify-between">

    <!-- Top Simple Nav -->
    <header class="py-6 px-8 max-w-7xl mx-auto w-full flex items-center justify-between">
        <a href="/" class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-brandDark flex items-center justify-center text-white">
                <i data-lucide="terminal" class="w-5 h-5"></i>
            </div>
            <span class="text-xl font-bold tracking-tight text-brandDark">VibeScout</span>
        </a>
        <a href="/" class="text-xs font-semibold text-slate-500 hover:text-slate-900 flex items-center gap-1 transition">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Back to Homepage
        </a>
    </header>

    <!-- Center Card -->
    <main class="flex-grow flex items-center justify-center px-4 py-8">
        <div class="bg-white rounded-2xl border border-slate-200 shadow-xl max-w-md w-full p-8 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1.5 bg-brandBlue"></div>

            <!-- Tab Switcher -->
            <div class="flex items-center rounded-lg bg-slate-100 p-1 mb-6">
                <button type="button" id="tab-signin" class="flex-1 py-2 text-xs font-bold rounded-md bg-white text-slate-900 shadow-sm transition">
                    Sign In
                </button>
                <button type="button" id="tab-signup" class="flex-1 py-2 text-xs font-bold rounded-md text-slate-500 hover:text-slate-900 transition">
                    Create Account (Start Hiring)
                </button>
            </div>

            <!-- Header Titles -->
            <div class="mb-6">
                <h1 id="form-title" class="text-2xl font-extrabold text-slate-900 tracking-tight">Welcome back</h1>
                <p id="form-subtext" class="text-xs text-slate-500 mt-1.5 leading-relaxed">
                    Already hiring with VibeScout? Enter your credentials to access your candidate pipelines and telemetry.
                </p>
            </div>

            <!-- Error Banner -->
            <div id="error-box" class="hidden mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-xs flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
                <span id="error-message">Invalid credentials</span>
            </div>

            <!-- Success Banner -->
            <div id="success-box" class="hidden mb-4 p-3 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs flex items-center gap-2">
                <i data-lucide="check-circle" class="w-4 h-4 shrink-0"></i>
                <span id="success-message">Success! Redirecting...</span>
            </div>

            <!-- Form -->
            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5">Work Email / Username</label>
                    <input type="text" id="email" required 
                           class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brandBlue focus:bg-white transition"
                           placeholder="recruiter@acmecorp.com"
                           value="admin@acme.com">
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-semibold text-slate-700">Password</label>
                        <span id="demo-hint" class="text-[10px] text-brandBlue font-semibold">(Default: admin)</span>
                    </div>
                    <input type="password" id="password" required 
                           class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brandBlue focus:bg-white transition"
                           placeholder="••••••••"
                           value="admin">
                </div>

                <button type="submit" id="submit-btn" 
                        class="w-full py-3 bg-brandDark text-white font-semibold rounded-lg hover:bg-slate-800 transition shadow-md shadow-slate-200 text-sm flex items-center justify-center gap-2 mt-2">
                    <span>Sign In to Dashboard</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>

                <!-- One Click Demo Login -->
                <button type="button" id="quick-demo-btn" 
                        class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-lg transition text-xs flex items-center justify-center gap-1.5 border border-slate-200">
                    <i data-lucide="zap" class="w-3.5 h-3.5 text-amber-500"></i> Instant 1-Click Demo Login
                </button>
            </form>

            <!-- Bottom Toggle Link -->
            <div class="mt-6 pt-5 border-t border-slate-100 text-center">
                <p id="toggle-prompt" class="text-xs text-slate-500">
                    New to VibeScout? 
                    <button type="button" id="toggle-btn" class="text-brandBlue font-semibold hover:underline ml-1">
                        Create company workspace
                    </button>
                </p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-xs text-slate-400">
        © 2026 VibeScout Inc. • Enterprise Candidate Evaluation
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide && typeof lucide.createIcons === 'function') {
                try { lucide.createIcons(); } catch(e) {}
            }

            const tabSignin = document.getElementById('tab-signin');
            const tabSignup = document.getElementById('tab-signup');
            const formTitle = document.getElementById('form-title');
            const formSubtext = document.getElementById('form-subtext');
            const submitBtn = document.getElementById('submit-btn');
            const toggleBtn = document.getElementById('toggle-btn');
            const errorBox = document.getElementById('error-box');
            const errorMessage = document.getElementById('error-message');
            const successBox = document.getElementById('success-box');
            const successMessage = document.getElementById('success-message');
            const demoHint = document.getElementById('demo-hint');
            const authForm = document.getElementById('auth-form');
            const quickDemoBtn = document.getElementById('quick-demo-btn');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');

            let mode = 'signin'; // 'signin' or 'signup'

            function setMode(newMode) {
                mode = newMode;
                if (errorBox) errorBox.classList.add('hidden');
                if (successBox) successBox.classList.add('hidden');

                if (mode === 'signin') {
                    if (tabSignin) tabSignin.className = "flex-1 py-2 text-xs font-bold rounded-md bg-white text-slate-900 shadow-sm transition";
                    if (tabSignup) tabSignup.className = "flex-1 py-2 text-xs font-bold rounded-md text-slate-500 hover:text-slate-900 transition";
                    if (formTitle) formTitle.textContent = "Welcome back";
                    if (formSubtext) formSubtext.textContent = "Already hiring with VibeScout? Enter your credentials to access your candidate pipelines and telemetry.";
                    if (submitBtn) submitBtn.querySelector('span').textContent = "Sign In to Dashboard";
                    if (demoHint) demoHint.style.display = 'inline';
                    if (toggleBtn) toggleBtn.textContent = "Create company workspace";
                    const prompt = document.getElementById('toggle-prompt');
                    if (prompt && prompt.firstChild) prompt.firstChild.textContent = "New to VibeScout? ";
                } else {
                    if (tabSignup) tabSignup.className = "flex-1 py-2 text-xs font-bold rounded-md bg-white text-slate-900 shadow-sm transition";
                    if (tabSignin) tabSignin.className = "flex-1 py-2 text-xs font-bold rounded-md text-slate-500 hover:text-slate-900 transition";
                    if (formTitle) formTitle.textContent = "Start Hiring with VibeScout";
                    if (formSubtext) formSubtext.textContent = "Create your recruiter account to begin issuing instant isolated sandbox magic links.";
                    if (submitBtn) submitBtn.querySelector('span').textContent = "Create Account & Start Hiring";
                    if (demoHint) demoHint.style.display = 'none';
                    if (toggleBtn) toggleBtn.textContent = "Sign in here";
                    const prompt = document.getElementById('toggle-prompt');
                    if (prompt && prompt.firstChild) prompt.firstChild.textContent = "Already hiring? ";
                }
            }

            // Check URL params for mode
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('mode') === 'signup') {
                setMode('signup');
            } else {
                setMode('signin');
            }

            if (tabSignin) tabSignin.addEventListener('click', () => setMode('signin'));
            if (tabSignup) tabSignup.addEventListener('click', () => setMode('signup'));
            if (toggleBtn) toggleBtn.addEventListener('click', () => setMode(mode === 'signin' ? 'signup' : 'signin'));

            async function performAuth(email, password, endpoint) {
                if (submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.classList.add('opacity-75');
                }

                try {
                    const res = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: email, username: email, password: password })
                    });

                    if (res.ok) {
                        const data = await res.json();
                        if (data.token) {
                            localStorage.setItem('vibescout_token', data.token);
                            localStorage.setItem('vibescout_user', data.user || email);
                        }
                        if (successBox) {
                            successBox.classList.remove('hidden');
                            if (successMessage) successMessage.textContent = mode === 'signin' ? "Authenticated! Opening dashboard..." : "Account created! Initializing dashboard...";
                        }
                        setTimeout(() => {
                            window.location.href = '/dashboard.html';
                        }, 300);
                    } else {
                        const text = await res.text();
                        if (errorBox) {
                            errorBox.classList.remove('hidden');
                            if (errorMessage) errorMessage.textContent = text || "Authentication failed. Please check credentials.";
                        }
                    }
                } catch (err) {
                    if (errorBox) {
                        errorBox.classList.remove('hidden');
                        if (errorMessage) errorMessage.textContent = "Network error connecting to backend: " + err.message;
                    }
                } finally {
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.classList.remove('opacity-75');
                    }
                }
            }

            if (authForm) {
                authForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    if (errorBox) errorBox.classList.add('hidden');
                    if (successBox) successBox.classList.add('hidden');

                    const email = emailInput ? emailInput.value.trim() : '';
                    const password = passwordInput ? passwordInput.value : '';
                    const endpoint = mode === 'signin' ? '/api/admin/login' : '/api/admin/register';

                    await performAuth(email, password, endpoint);
                });
            }

            // 1-Click Demo Login
            if (quickDemoBtn) {
                quickDemoBtn.addEventListener('click', async () => {
                    if (emailInput) emailInput.value = 'admin@acme.com';
                    if (passwordInput) passwordInput.value = 'admin';
                    await performAuth('admin@acme.com', 'admin', '/api/admin/login');
                });
            }
        });
    </script>
</body>
</html>
